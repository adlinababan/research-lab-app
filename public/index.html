<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Research Lab · Riset Lintas Prodi Berbantuan AI</title>
<meta name="description" content="Dari tema ke pertanyaan riset, literatur nyata dari OpenAlex, matriks gap, sampai draf paper di template IEEE.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='12' cy='16' r='9' fill='none' stroke='%232560C8' stroke-width='3'/%3E%3Ccircle cx='20' cy='16' r='9' fill='none' stroke='%23E07A2E' stroke-width='3'/%3E%3C/svg%3E">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><circle cx="12" cy="16" r="9" fill="none" stroke="var(--ai)" stroke-width="2.5"/><circle cx="20" cy="16" r="9" fill="none" stroke="var(--human)" stroke-width="2.5"/></svg>
    <div>
      <div class="brand-name">Research Lab</div>
      <div class="brand-sub" id="eventName">Riset lintas prodi berbantuan AI</div>
    </div>
  </div>
  <div class="top-actions">
    <span class="chip" id="statusChip">Memeriksa koneksi…</span>
    <button class="btn ghost small" id="resetBtn" type="button">Mulai baru</button>
  </div>
</header>

<div class="layout">
  <nav class="stepper" id="stepper" aria-label="Tahapan"></nav>
  <main id="main" tabindex="-1"></main>
</div>

<div class="modal" id="accessModal" hidden>
  <form class="modal-card" id="accessForm">
    <h2>Masukkan kode akses</h2>
    <p>Kode dibagikan oleh narasumber di awal sesi.</p>
    <label class="field"><span>Kode akses</span><input id="accessInput" autocomplete="off" required></label>
    <p class="error" id="accessError" hidden>Kode salah. Coba lagi.</p>
    <button class="btn primary" type="submit">Masuk</button>
  </form>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="app.js" type="module"></script>
</body>
</html>
