# Nginx untuk Research Lab (VPS). Salin ke /etc/nginx/sites-available/research-lab,
# ganti DOMAIN_ANDA, lalu: ln -s ../sites-available/research-lab /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# Setelah itu pasang HTTPS: certbot --nginx -d DOMAIN_ANDA
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_ANDA;

    # Tampilan web (index.html, app.js, styles.css, …) dari folder public/ aplikasi utama
    root /var/www/research-lab/public;
    index index.html;

    client_max_body_size 30m;          # unggah gambar hasil dan data sesi
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /index.html { add_header Cache-Control "no-cache"; }
    location ~* \.(js|css)$ { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # API dan panel admin -> CodeIgniter 4
    location ~ ^/(api|admin)(/|$) {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/research-lab/vps/ci4/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/research-lab/vps/ci4/public;
        fastcgi_read_timeout 300s;     # penyusunan draf dan review bisa 30–120 detik
        fastcgi_send_timeout 300s;
    }

    # Root hanya berisi berkas tampilan; kode server ada di luar root. Berkas tersembunyi tetap ditolak.
    location ~ /\.(?!well-known) { deny all; }

    location / { try_files $uri $uri/ /index.html; }
}
